name: Test Suite

on:
  push:
    branches: [ main, dev, feature/documentation-and-testing ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libcfitsio-dev libgsl-dev cmake build-essential
    
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install gfortran cfitsio gsl cmake
        # Set Fortran compiler path for CMake
        echo "FC=$(which gfortran)" >> $GITHUB_ENV
    
    - name: Debug compiler availability
      run: |
        echo "Available compilers:"
        which gfortran || echo "gfortran not found"
        which gcc || echo "gcc not found"
        which g++ || echo "g++ not found"
        echo "PATH: $PATH"
    
    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_Fortran_COMPILER=gfortran
    
    - name: Build
      run: |
        cmake --build build --parallel
    
    - name: Run smoke tests (CI subset)
      run: |
        python3 smoke_test/run_smoke_test.py --ci --exec-timeout 610
    
    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-outputs-${{ matrix.os }}-${{ matrix.build_type }}
        path: smoke_test/output/
        retention-days: 7
