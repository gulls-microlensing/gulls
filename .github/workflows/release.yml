name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: 3.9
    
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        conda env create -f environment.yml
        conda activate gulls
        conda list
    
    - name: Configure CMake
      shell: bash -l {0}
      run: |
        conda activate gulls
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    
    - name: Build
      shell: bash -l {0}
      run: |
        conda activate gulls
        cmake --build build --parallel
    
    - name: Run smoke tests
      shell: bash -l {0}
      run: |
        conda activate gulls
        python3 smoke_test/run_smoke_test.py --ci --exec-timeout 610
    
    - name: Build documentation
      shell: bash -l {0}
      run: |
        conda activate gulls
        cd documentation
        make html
    
    - name: Create release archive
      run: |
        # Create source archive
        git archive --format=tar.gz --prefix=gulls-${{ github.ref_name }}/ -o gulls-${{ github.ref_name }}.tar.gz HEAD
        
        # Create binary archive with GSL fallback warning
        echo "⚠️  WARNING: Binaries include GSL fallback implementations" > BINARY_WARNING.txt
        echo "These are for testing/CI only and NOT suitable for production science." >> BINARY_WARNING.txt
        echo "For production use, compile from source with licensed Numerical Recipes." >> BINARY_WARNING.txt
        echo "" >> BINARY_WARNING.txt
        echo "See documentation for details on replacing GSL stubs with Numerical Recipes." >> BINARY_WARNING.txt
        
        tar -czf gulls-${{ github.ref_name }}-binaries.tar.gz bin/ documentation/build/html/ BINARY_WARNING.txt
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          gulls-${{ github.ref_name }}.tar.gz
          gulls-${{ github.ref_name }}-binaries.tar.gz
        body: |
          ## ⚠️ Important Notice
          
          **Binary releases include GSL fallback implementations and are NOT suitable for production science.**
          
          - **For production use**: Download source code and compile with licensed Numerical Recipes
          - **For testing/development**: Binary releases are fine for testing workflows
          - **See documentation**: Details on replacing GSL stubs with Numerical Recipes
          
          ## What's Included
          
          - **Source code**: Complete Gulls source with CMake build system
          - **Binaries**: Linux/macOS executables (GSL fallbacks - testing only)
          - **Documentation**: Built HTML documentation
        generate_release_notes: false
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
